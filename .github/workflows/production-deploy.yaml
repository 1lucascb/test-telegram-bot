name: Deploy to Production

# Triggers only when a Pull Request to main is closed
on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    # Grants permissions required to read code and push Docker images to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Download code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry using the automatic GITHUB_TOKEN
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Build the Docker image and push it to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Converts repository name to lowercase automatically to prevent GHCR tag errors
          tags: ghcr.io/${{ github.repository }}:latest

      # Step 4: SSH into your VPS and execute the remote deploy script
      - name: Execute remote deploy script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP_ADDRESS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          # Pass required GitHub variables into the remote SSH shell environment
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY_OWNER,GITHUB_REPOSITORY
          script: |
            export GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            export REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export REPO_FULL_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export REPO_NAME="${{ github.event.repository.name }}"
            
            $HOME/$REPO_NAME/deploy.sh