name: Create PR to production

on:
  pull_request:
    branches:
      - development
    types:
      - closed

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    name: Create PR to production
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Create Pull Request if none exists
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: existingPRs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:development`
            });

            if (existingPRs.length > 0) {
              console.log('An open PR from development to main already exists.');
              return;
            }

            const { data: newPR } = await github.rest.pulls.create({
              owner,
              repo,
              title: 'Merge development into production',
              body: 'This PR merges the changes from the development branch into the production branch.',
              head: 'development',
              base: 'main'
            });

            console.log(`PR created successfully: ${newPR.html_url}`);